<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order · Black Peacock Printing</title>
<meta name="theme-color" content="#0D0D0D">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Black Peacock Printing">
<meta property="og:description" content="Track your order.">
<meta property="og:image" content="https://blackpeacockprinting.com/og-image.png">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0D0D0D; --gold:#C9A84C;
    --plate:#FFFFFF; --ink:#141414; --muted:#5B5B5B; --hair:#DCDCDC;
    --dim:#9A9A9A;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--black); color:#F4F4F4;
    font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;
    font-size:16px; line-height:1.5;
    padding:calc(env(safe-area-inset-top,0px) + 28px) 16px calc(env(safe-area-inset-bottom,0px) + 40px);
  }
  .wrap{max-width:560px;margin:0 auto}

  .mark{
    text-align:center;font-size:12px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--gold);margin-bottom:26px;font-weight:600;
  }

  /* the vitrine plate */
  .plate{background:var(--plate);color:var(--ink);border-top:1px solid var(--gold);padding:26px 22px}
  .plate + .plate{margin-top:16px}

  h1{
    font-family:'Bodoni Moda',Georgia,serif;font-weight:400;
    font-size:30px;line-height:1.15;margin:0 0 4px;letter-spacing:-.01em;
  }
  .ref{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

  /* status pipeline */
  .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:24px 0 10px}
  .step .box{height:6px;background:#E4E4E4}
  .step.on .box{background:var(--ink)}
  .step.un .box{background:repeating-linear-gradient(45deg,var(--muted) 0 1px,transparent 1px 4px)}
  .step .lbl{
    font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-top:7px;
    color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .step.on .lbl{color:var(--ink);font-weight:600}
  .state{font-size:14px;color:var(--muted);margin-top:14px}

  /* items */
  h2{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px;font-weight:600}
  .item{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-top:1px solid var(--hair)}
  .item:last-child{border-bottom:1px solid var(--hair)}
  .item .n{font-weight:500}
  .item .s{font-size:13px;color:var(--muted);white-space:nowrap}

  /* money band — gold only reads well on black, so the total gets its own */
  .band{background:var(--black);color:#F4F4F4;padding:18px 22px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .band .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .band .amt{font-size:26px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
  .pay{font-size:13px;color:var(--muted);margin-top:14px}
  .note{font-size:14px;color:var(--muted);margin-top:18px}

  /* lookup + messages */
  label span{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  input{
    width:100%;padding:13px 14px;border:1px solid #C9C9C9;background:#fff;color:var(--ink);
    border-radius:0;-webkit-appearance:none;appearance:none;font:inherit;
    letter-spacing:.1em;text-transform:uppercase;
  }
  button.go{
    width:100%;margin-top:12px;padding:14px;background:var(--ink);color:#fff;border:0;
    font:inherit;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;cursor:pointer;
  }
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .foot{text-align:center;font-size:12px;color:#6E6E6E;margin-top:30px;line-height:1.7}
  .foot a{color:#9A9A9A}
</style>
</head>
<body>
<div class="wrap">
  <div class="mark">Black Peacock Printing</div>
  <div id="out"></div>
  <div class="foot">
    Designs by N3D Melbourne, printed under commercial licence.<br>
    <a href="mailto:kontakt@blackpeacockprinting.com">kontakt@blackpeacockprinting.com</a>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://bcbbwomddlrurazmhivc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_oYFZJgovrJlTHhZIliUhiw_yGtUo7eg';

const T = {
  en:{
    lookupTitle:'Track your order',
    lookupLabel:'Order reference',
    go:'Look it up',
    notFound:'We could not find that reference. Check the code from your confirmation email, or reply to it and we will sort it out.',
    trouble:'Something went wrong loading this. Try again in a moment.',
    steps:['Received','Printing','Ready','Collected'],
    itemWord:{ new:'To print', printing:'Printing', ready:'Done', collected:'Collected', unclaimed:'Unclaimed' },
    state:{
      new:'Your order is in the queue.',
      printing:'Your figures are on the printers.',
      ready:'Everything is assembled and waiting for you.',
      collected:'Collected. Thanks for your order.',
      unclaimed:'This order is being held.'
    },
    progress:(a,b)=>`${a} of ${b} finished`,
    items:'Your order',
    due:'Due at pickup',
    paid:'Paid',
    payment:p=>`Payment at pickup: ${p}`,
    hi:n=>`Hello ${n}`
  },
  de:{
    lookupTitle:'Bestellung verfolgen',
    lookupLabel:'Bestellnummer',
    go:'Anzeigen',
    notFound:'Diese Nummer konnten wir nicht finden. Bitte prüfe den Code aus deiner Bestätigungsmail oder antworte einfach darauf.',
    trouble:'Beim Laden ist etwas schiefgegangen. Bitte versuche es gleich noch einmal.',
    steps:['Eingegangen','Im Druck','Abholbereit','Abgeholt'],
    itemWord:{ new:'Zu drucken', printing:'Im Druck', ready:'Fertig', collected:'Abgeholt', unclaimed:'Nicht abgeholt' },
    state:{
      new:'Deine Bestellung ist in der Warteschlange.',
      printing:'Deine Figuren sind auf den Druckern.',
      ready:'Alles ist fertig montiert und wartet auf dich.',
      collected:'Abgeholt. Vielen Dank für deine Bestellung.',
      unclaimed:'Diese Bestellung wird zurückgehalten.'
    },
    progress:(a,b)=>`${a} von ${b} fertig`,
    items:'Deine Bestellung',
    due:'Fällig bei Abholung',
    paid:'Bezahlt',
    payment:p=>`Zahlung bei Abholung: ${p}`,
    hi:n=>`Hallo ${n}`
  }
};

const PAY = {
  en:{ cash:'cash', paypal:'PayPal', bank_transfer:'bank transfer', zelle:'Zelle' },
  de:{ cash:'Barzahlung', paypal:'PayPal', bank_transfer:'Überweisung', zelle:'Zelle' }
};

const STEP = { new:1, printing:2, ready:3, collected:4 };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (n, cur) => {
  const v = Number(n) || 0;
  return String(cur||'EUR').trim().toUpperCase() === 'USD'
    ? '$' + v.toFixed(2)
    : v.toFixed(2).replace('.', ',') + ' €';
};
const browserLang = () => (navigator.language||'en').toLowerCase().startsWith('de') ? 'de' : 'en';
const out = document.getElementById('out');

function refFromUrl(){
  const q = new URLSearchParams(location.search).get('ref');
  if (q) return q.trim().toUpperCase();
  const m = location.pathname.match(/BPP-[A-Z0-9]{6}/i);
  return m ? m[0].toUpperCase() : '';
}

function renderLookup(msg){
  const t = T[browserLang()];
  out.innerHTML = `
    <div class="plate">
      <h1>${t.lookupTitle}</h1>
      ${msg ? `<p class="note">${esc(msg)}</p>` : ''}
      <div style="margin-top:20px">
        <label><span>${t.lookupLabel}</span>
          <input id="ref" value="" placeholder="BPP-XXXXXX" autocomplete="off" spellcheck="false"></label>
        <button class="go" id="go">${t.go}</button>
      </div>
    </div>`;
  const fire = () => {
    const v = document.getElementById('ref').value.trim().toUpperCase();
    if (v) location.search = '?ref=' + encodeURIComponent(v);
  };
  document.getElementById('go').onclick = fire;
  document.getElementById('ref').addEventListener('keydown', e => { if (e.key === 'Enter') fire(); });
}

function renderOrder(o){
  const t = T[o.lang === 'de' ? 'de' : 'en'];
  const payDict = PAY[o.lang === 'de' ? 'de' : 'en'];
  const done = !!o.collected_at;
  const step = STEP[o.status] || 0;
  const unclaimed = o.status === 'unclaimed';

  const steps = t.steps.map((label, ix) => {
    const cls = unclaimed ? 'step un' : (ix < step ? 'step on' : 'step');
    return `<div class="${cls}"><div class="box"></div><div class="lbl">${label}</div></div>`;
  }).join('');

  const items = (o.items||[]).map(i => `
    <div class="item">
      <span class="n">${i.qty > 1 ? i.qty + ' × ' : ''}${esc(i.name)}</span>
      <span class="s">${t.itemWord[i.status] || i.status}</span>
    </div>`).join('');

  const pay = (o.payments||[]).map(p => payDict[p] || p).join(o.lang === 'de' ? ' oder ' : ' or ');

  out.innerHTML = `
    <div class="plate">
      <h1>${t.hi(esc(o.first_name || ''))}</h1>
      <div class="ref">${esc(o.ref)}</div>

      <div class="steps">${steps}</div>
      <div class="state">
        ${t.state[o.status] || ''}
        ${!done && o.item_count > 1 ? ' · ' + t.progress(o.items_done, o.item_count) : ''}
      </div>

      <h2>${t.items}</h2>
      ${items}

      ${!done && o.turnaround ? `<p class="note">${esc(o.turnaround)}</p>` : ''}
      ${!done && pay ? `<p class="pay">${esc(t.payment(pay))}</p>` : ''}
    </div>

    <div class="band">
      <span class="lbl">${done ? t.paid : t.due}</span>
      <span class="amt">${money(o.amount_due, o.currency)}</span>
    </div>`;
}

async function load(){
  const ref = refFromUrl();
  if (!ref) return renderLookup();

  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_order_by_ref`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}` },
      body: JSON.stringify({ p_ref: ref })
    });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    if (!data) return renderLookup(T[browserLang()].notFound);
    renderOrder(data);
  } catch (e) {
    renderLookup(T[browserLang()].trouble);
  }
}

load();
</script>
</body>
</html>
