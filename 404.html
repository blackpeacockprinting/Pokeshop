<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Not found · Black Peacock Printing</title>
<meta name="theme-color" content="#0D0D0D">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico">
<script>
  /* GitHub Pages cannot serve /order/BPP-XXXXXX as a real path, so the
     confirmation emails land here first. Hand the token to the tracking
     page and get out of the way. */
  (function () {
    var m = location.pathname.match(/^\/order\/(BPP-[A-Za-z0-9]{6})\/?$/);
    if (m) location.replace('/order/?ref=' + m[1].toUpperCase());
  })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0}
  body{
    background:#0D0D0D;color:#F4F4F4;
    font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;
    min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .wrap{max-width:460px;width:100%;text-align:center}
  .mark{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#C9A84C;font-weight:600;margin-bottom:26px}
  .plate{background:#fff;color:#141414;border-top:1px solid #C9A84C;padding:34px 24px}
  h1{font-family:'Bodoni Moda',Georgia,serif;font-weight:400;font-size:46px;margin:0 0 8px;line-height:1}
  p{margin:0 0 6px;color:#5B5B5B;font-size:15px}
  p.de{margin-bottom:22px}
  a.go{
    display:inline-block;margin-top:6px;background:#141414;color:#fff;text-decoration:none;
    padding:13px 22px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:13px;
  }
  :focus-visible{outline:2px solid #C9A84C;outline-offset:2px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">Black Peacock Printing</div>
    <div class="plate">
      <h1>404</h1>
      <p>This page does not exist.</p>
      <p class="de">Diese Seite gibt es nicht.</p>
      <a class="go" href="/">Home · Startseite</a>
    </div>
  </div>
</body>
</html>
